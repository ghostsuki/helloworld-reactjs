<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Fornecedores - Mercado</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <nav>
            <a href="produtos.html">Produtos</a>
            <a href="clientes.html">Clientes</a>
            <a href="fornecedores.html">Fornecedores</a>
            <a href="vendas.html">Vendas</a>
            <a href="relatorios.html">Relatórios</a>
        </nav>
        
        <h1>Gerenciamento de Fornecedores</h1>

        <form id="form-fornecedor">
            <input type="hidden" id="fornecedor-id">
            <input type="text" id="nome-fantasia" placeholder="Nome Fantasia" required>
            <input type="text" id="razao-social" placeholder="Razão Social">
            <input type="text" id="cnpj" placeholder="CNPJ" required>
            <input type="text" id="telefone" placeholder="Telefone">
            <input type="email" id="email" placeholder="E-mail">
            <button type="submit">Salvar</button>
        </form>

        <h2>Lista de Fornecedores</h2>
        <table id="tabela-fornecedores">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome Fantasia</th>
                    <th>CNPJ</th>
                    <th>Telefone</th>
                    <th>E-mail</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
